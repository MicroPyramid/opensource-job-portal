site_name: PeelJobs
site_description: >-
  Open-source job board platform. Django REST API with SvelteKit frontends for
  job seekers and recruiters.
site_url: https://opensource-job-portal.readthedocs.io/
copyright: Released under the MIT License

repo_url: https://github.com/MicroPyramid/opensource-job-portal
repo_name: MicroPyramid/opensource-job-portal
edit_uri: edit/master/docs/

docs_dir: docs

# MUST be set explicitly. MkDocs defaults `site_dir` to `site/`, which in this
# repository is the SvelteKit job-seeker application -- and `mkdocs build`
# defaults to `--clean`, which empties `site_dir` before writing. Left at the
# default, a docs build would delete the frontend.
site_dir: _site

# Internal working notes that live in docs/ but are not part of the published
# site. They stay in place rather than moving: docs/django-retirement.md is
# generated by `manage.py retirement_inventory`, whose default output path is
# ../docs/django-retirement.md.
exclude_docs: |
  superpowers/
  django-retirement.md
  jobseeker-migration-status.md
  recruiter-migration-status.md
  recruiter-dashboard-urls.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Required for the `:material-*:` icon shortcodes used in the card grids.
  # Without this they render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MicroPyramid/opensource-job-portal
      name: PeelJobs on GitHub

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Test Data: getting-started/test-data.md
      - Running the Stack: getting-started/running.md
  - Architecture:
      - architecture/index.md
      - Backend: architecture/backend.md
      - Frontends: architecture/frontends.md
      - Authentication: architecture/authentication.md
      - Search: architecture/search.md
      - Background Jobs: architecture/background-jobs.md
  - Deployment:
      - Production: deployment/production.md
  - User Guides:
      - guides/index.md
      - Job Seekers: guides/job-seekers.md
      - Recruiters: guides/recruiters.md
      - Administrators: guides/administrators.md
  - Contributing:
      - contributing/index.md
      - Code Standards: contributing/code-standards.md
      - Testing: contributing/testing.md
  - About:
      - Mission & Values: about/mission.md
