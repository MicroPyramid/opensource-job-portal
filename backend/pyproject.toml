[project]
name = "opensource-job-portal"
version = "0.1.0"
description = "An opensource job portal with unlimited free job posting and social API authentication."
readme = "../README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Micropyramid", email = "hello@micropyramid.com" }]

dependencies = [
    # Core Framework
    # Django is held on the 5.2 LTS series (supported to April 2028). Latest is
    # 6.1, but django-celery-beat caps Django at <6.1, and django-storages and
    # django-schema-viewer publish no 6.x classifier. (django-haystack was a
    # fourth blocker until search moved to Postgres.)
    "django==5.2.17",
    "python-dotenv==1.2.2",
    # Database
    "psycopg[binary]==3.3.4",
    "pymemcache==4.0.0",
    # Task Queue & Background Jobs
    "celery==5.6.3",
    "django-celery-beat==2.9.0",
    # NOTE: kombu declares redis<6.5 for its redis extra. This project depends on
    # redis directly rather than via celery[redis], so that cap is not enforced
    # during resolution. Kept deliberately ahead of it, as it already was at 7.1.0.
    "redis==8.1.0",
    # Search needs no dependency: it is Postgres full-text search over a
    # generated tsvector column plus pg_trgm, both built into the database.
    # This block used to pin django-haystack + an elasticsearch client capped at
    # 7.x; see peeldb/migrations/0079 and api/v1/jobs/filters.py.
    # REST API
    "djangorestframework==3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "dj-rest-auth==7.2.0",
    "drf-spectacular==0.30.0",
    "django-filter==26.1",
    # Storage & Media
    "boto3==1.43.68",
    "django-storages==1.14.6",
    "sorl-thumbnail==13.0.0",
    "pillow==12.3.0",
    # Email
    "django-ses==4.7.2",
    # Frontend & Assets
    "django-compressor==4.6.0",
    "django-cors-headers==4.9.0",
    # Utilities
    "arrow==1.4.0",
    "lxml==6.1.1",
    "requests==2.34.2",
    "pytz==2026.3.post1",
    # Monitoring & Error Tracking
    "sentry-sdk[django]==2.67.1",
    # Production Server
    "gunicorn==26.0.0",
]

[dependency-groups]
dev = [
    # Code Quality & Linting
    # `ruff format` supersedes black (it is a Black-compatible formatter), so
    # black is intentionally not declared here. Ruff's defaults match black's
    # 88-column style, which is why no [tool.ruff] config is needed yet.
    "ruff==0.16.2",
    "prospector==1.19.1",
    # Testing
    # behave-django went with `features/`, deleted 2026-08-13: that suite
    # imported `django_behave` (a different, uninstalled package), TEST_RUNNER
    # had stopped pointing at it, and its scenarios drove `/`,
    # `/user/reg_success/` and `/logout/` — routes that went with candidate/
    # and pjob/.
    "coverage==7.15.4",
    # Development Tools
    "bpython==0.26",
    "django-schema-viewer==0.5.3",
    # Debug Tools (uncomment in settings_local.py to use)
    "django-debug-toolbar-template-profiler==2.1.0",
]

[tool.uv]
# This is an application, not a distributable library. No [build-system] is
# declared, so uv installs the dependencies without building or installing the
# project itself. Stated explicitly rather than left to inference.
package = false

[tool.ruff.lint]
# These are suppressions, not fixes. Each is suppressed because applying the
# rule to this codebase would be wrong, not because the work was skipped.
ignore = [
    # RUF012: "mutable default for class attribute -> annotate with ClassVar".
    # Fires ~284 times, almost entirely on Django/DRF framework idioms:
    # `class Meta: fields = [...]`, `read_only_fields`, `filterset_fields`,
    # ModelForm `Meta.fields`. These are the frameworks' prescribed API, read as
    # class-level configuration. Annotating them ClassVar is runtime-harmless but
    # adds ~284 annotations and a typing import to ~30 files for no benefit.
    "RUF012",

    # DTZ*: "naive datetime". This project runs with USE_TZ = False
    # (jobsp/settings.py), so Django itself stores and returns naive datetimes
    # throughout. Making these calls timezone-aware would produce aware datetimes
    # that conflict with every DateTimeField in the project -- an actual bug, not
    # a fix. Revisit only as part of a deliberate USE_TZ = True migration.
    "DTZ002",
    "DTZ003",
    "DTZ005",
    "DTZ007",
    "DTZ011",

    # BLE001: "do not catch blind Exception". Commit 66513e7 deliberately
    # converted bare `except:` into `except Exception:` to satisfy E722; BLE001
    # then objects to the result. Narrowing all 68 sites requires knowing what
    # each can actually raise -- real work, not a mechanical fix. Suppressed so
    # the lint is actionable; tracked as tech debt rather than guessed at.
    "BLE001",
]
